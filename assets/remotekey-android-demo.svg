<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
<title id="t">RemoteKey Android client interface</title><desc id="d">Dark Android interface with host, port, token, accessibility status, connection status and latest shortcut.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142239"/><stop offset="1" stop-color="#080b12"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#9b8cff"/><stop offset="1" stop-color="#62d9ff"/></linearGradient></defs>
<rect width="800" height="560" rx="32" fill="#070a10"/><rect x="44" y="28" width="712" height="504" rx="28" fill="url(#bg)" stroke="#53627a" stroke-opacity=".55"/>
<rect x="68" y="52" width="664" height="54" rx="14" fill="#101722"/><circle cx="96" cy="79" r="15" fill="url(#a)"/><text x="124" y="86" fill="#f5f7fb" font-family="Segoe UI,Arial" font-size="24" font-weight="700">RemoteKey</text><text x="665" y="84" fill="#66e4a7" font-family="Consolas" font-size="13">READY</text>
<text x="76" y="145" fill="#8490a6" font-family="Consolas" font-size="12" letter-spacing="1.4">WINDOWS HOST</text>
<rect x="68" y="158" width="310" height="66" rx="12" fill="#0b1019" stroke="#334057"/><text x="88" y="181" fill="#758198" font-family="Segoe UI,Arial" font-size="12">Host / IP address</text><text x="88" y="207" fill="#f5f7fb" font-family="Consolas" font-size="18">192.168.1.24</text>
<rect x="394" y="158" width="132" height="66" rx="12" fill="#0b1019" stroke="#334057"/><text x="414" y="181" fill="#758198" font-family="Segoe UI,Arial" font-size="12">Port</text><text x="414" y="207" fill="#f5f7fb" font-family="Consolas" font-size="18">45892</text>
<rect x="542" y="158" width="190" height="66" rx="12" fill="#0b1019" stroke="#334057"/><text x="562" y="181" fill="#758198" font-family="Segoe UI,Arial" font-size="12">Token</text><text x="562" y="207" fill="#f5f7fb" font-family="Consolas" font-size="18">••••••••••</text>
<rect x="68" y="248" width="664" height="70" rx="15" fill="#0c1416" stroke="#66e4a7" stroke-opacity=".55"/><circle cx="100" cy="283" r="12" fill="#66e4a7"/><text x="126" y="279" fill="#f5f7fb" font-family="Segoe UI,Arial" font-size="16" font-weight="700">Accessibility service</text><text x="126" y="300" fill="#9ca8bb" font-family="Segoe UI,Arial" font-size="13">Physical keyboard capture is enabled</text><text x="646" y="289" fill="#66e4a7" font-family="Consolas" font-size="13" font-weight="700">ENABLED</text>
<rect x="68" y="334" width="322" height="112" rx="16" fill="#101722" stroke="#334057"/><text x="90" y="362" fill="#758198" font-family="Consolas" font-size="12">CONNECTION</text><circle cx="94" cy="398" r="8" fill="#66e4a7"/><text x="112" y="405" fill="#f5f7fb" font-family="Segoe UI,Arial" font-size="18" font-weight="700">Connected</text><text x="90" y="428" fill="#9ca8bb" font-family="Segoe UI,Arial" font-size="13">Windows agent authenticated</text>
<rect x="410" y="334" width="322" height="112" rx="16" fill="#101722" stroke="#334057"/><text x="432" y="362" fill="#758198" font-family="Consolas" font-size="12">LAST SHORTCUT</text><rect x="432" y="382" width="74" height="38" rx="8" fill="#202b3b" stroke="#53627a"/><text x="451" y="407" fill="#f5f7fb" font-family="Consolas" font-size="14" font-weight="700">ALT</text><text x="516" y="406" fill="#8490a6" font-family="Segoe UI,Arial" font-size="17">+</text><rect x="538" y="382" width="74" height="38" rx="8" fill="#202b3b" stroke="#53627a"/><text x="558" y="407" fill="#f5f7fb" font-family="Consolas" font-size="14" font-weight="700">TAB</text><text x="632" y="406" fill="#66e4a7" font-family="Consolas" font-size="13">SENT</text>
<rect x="68" y="466" width="664" height="42" rx="12" fill="url(#a)"/><text x="327" y="493" fill="#071019" font-family="Segoe UI,Arial" font-size="15" font-weight="800">RemoteKey enabled</text>
</svg>
