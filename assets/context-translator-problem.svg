<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Context-aware subtitle translation comparison</title><desc id="desc">Portfolio product reconstruction based on the implemented Context Video Translator interface.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#0e1727"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9b8cff"/><stop offset=".55" stop-color="#62d9ff"/><stop offset="1" stop-color="#66e4a7"/></linearGradient>
  <linearGradient id="video" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c45"/><stop offset=".55" stop-color="#1d5261"/><stop offset="1" stop-color="#3d6074"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".42"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#93a4bd" stroke-opacity=".07"/></pattern>
</defs>
<rect width="100%" height="100%" rx="34" fill="url(#bg)"/><rect width="100%" height="100%" rx="34" fill="url(#grid)"/>
<text x="800" y="75" text-anchor="middle" fill="#f5f7fb" font-family="Inter,Arial" font-size="42" font-weight="850">Why neighboring dialogue changes the translation</text>
<text x="800" y="112" text-anchor="middle" fill="#a4afc2" font-family="Inter,Arial" font-size="18">The subtitle is identical. The available context is not.</text>
<g transform="translate(80 165)"><rect width="680" height="610" rx="28" fill="#111722" stroke="#ff7f8f" stroke-opacity=".35"/><text x="36" y="56" fill="#ff7f8f" font-family="Inter,Arial" font-size="20" font-weight="800">ISOLATED LINE</text><text x="36" y="88" fill="#a4afc2" font-family="Inter,Arial" font-size="16">No previous or upcoming dialogue</text><rect x="36" y="128" width="608" height="110" rx="16" fill="#080d15"/><text x="340" y="183" text-anchor="middle" fill="#f5f7fb" font-family="Noto Sans JP,Arial" font-size="31">もうすぐ来ると思います。</text><path d="M340 262v65" stroke="#ff7f8f" stroke-width="4" stroke-linecap="round"/><path d="m326 312 14 15 14-15" fill="none" stroke="#ff7f8f" stroke-width="4"/><rect x="36" y="356" width="608" height="112" rx="16" fill="#26141d" stroke="#ff7f8f" stroke-opacity=".35"/><text x="340" y="407" text-anchor="middle" fill="#f5f7fb" font-family="Inter,Arial" font-size="24">“I think it will come soon.”</text><text x="340" y="442" text-anchor="middle" fill="#ffb1bb" font-family="Inter,Arial" font-size="15">What is “it”? The noun is unknown.</text><text x="36" y="535" fill="#ff7f8f" font-family="Inter,Arial" font-size="16" font-weight="800">RESULT</text><text x="36" y="568" fill="#a4afc2" font-family="Inter,Arial" font-size="17">Grammatically valid, contextually ambiguous.</text></g>
<g transform="translate(840 165)"><rect width="680" height="610" rx="28" fill="#111722" stroke="#66e4a7" stroke-opacity=".35"/><text x="36" y="56" fill="#66e4a7" font-family="Inter,Arial" font-size="20" font-weight="800">WITH CONTEXT</text><text x="36" y="88" fill="#a4afc2" font-family="Inter,Arial" font-size="16">Previous: “I arrived at the station.” · “I am waiting for my friend.”</text><rect x="36" y="128" width="608" height="110" rx="16" fill="#080d15"/><text x="340" y="183" text-anchor="middle" fill="#f5f7fb" font-family="Noto Sans JP,Arial" font-size="31">もうすぐ来ると思います。</text><path d="M340 262v65" stroke="#66e4a7" stroke-width="4" stroke-linecap="round"/><path d="m326 312 14 15 14-15" fill="none" stroke="#66e4a7" stroke-width="4"/><rect x="36" y="356" width="608" height="112" rx="16" fill="#10261f" stroke="#66e4a7" stroke-opacity=".35"/><text x="340" y="407" text-anchor="middle" fill="#f5f7fb" font-family="Inter,Arial" font-size="24">“I think my friend will arrive soon.”</text><text x="340" y="442" text-anchor="middle" fill="#9bf1c6" font-family="Inter,Arial" font-size="15">The omitted subject is resolved naturally.</text><text x="36" y="535" fill="#66e4a7" font-family="Inter,Arial" font-size="16" font-weight="800">RESULT</text><text x="36" y="568" fill="#a4afc2" font-family="Inter,Arial" font-size="17">Natural, specific and consistent with the conversation.</text></g></svg>