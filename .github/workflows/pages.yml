name: Quality checks and GitHub Pages deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate HTML
        run: npm run validate:html
      - name: Check local links and anchors
        run: npm run check:links
      - name: Audit images and assets
        run: npm run check:assets
      - name: Verify sitemap
        run: npm run check:sitemap
      - name: Upload static audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-quality-reports
          path: reports/
          if-no-files-found: ignore

  browser-quality:
    name: Browser and accessibility quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright and axe checks
        run: npm run test:browser
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Lighthouse CI
        run: npm run lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [static-quality, browser-quality, lighthouse]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Prepare production artifact
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ptd150101.github.io/portfolio-dtp' }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: |
          python3 scripts/build_site.py --output _site
          rsvg-convert -w 1200 -h 630 assets/og-home.svg -o _site/assets/og-home.png
          rsvg-convert -w 1200 -h 630 assets/og-remotekey.svg -o _site/assets/og-remotekey.png
          rsvg-convert -w 1200 -h 630 assets/context-translator-card.svg -o _site/assets/og-context-translator.png
          rsvg-convert -w 1200 -h 630 assets/og-resume.svg -o _site/assets/og-resume.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  production-status:
    name: Report production status
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [static-quality, browser-quality, lighthouse, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATIC_RESULT: ${{ needs.static-quality.result }}
          BROWSER_RESULT: ${{ needs.browser-quality.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          results = {
              "static": os.environ["STATIC_RESULT"],
              "browser": os.environ["BROWSER_RESULT"],
              "lighthouse": os.environ["LIGHTHOUSE_RESULT"],
              "deploy": os.environ["DEPLOY_RESULT"],
          }
          success = all(value == "success" for value in results.values())
          state = "success" if success else "failure"
          description = (
              "Quality gates passed and GitHub Pages deployed"
              if success
              else "Production pipeline failed: " + ", ".join(f"{key}={value}" for key, value in results.items())
          )
          payload = json.dumps(
              {
                  "state": state,
                  "context": "portfolio/production",
                  "description": description[:140],
                  "target_url": os.environ["TARGET_URL"],
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"Published production status: {state} ({response.status})")
          PY
