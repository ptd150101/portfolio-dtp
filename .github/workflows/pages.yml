name: Quality checks and GitHub Pages deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate HTML
        run: npm run validate:html
      - name: Check local links and anchors
        run: npm run check:links
      - name: Audit images and assets
        run: npm run check:assets
      - name: Verify sitemap
        run: npm run check:sitemap
      - name: Upload static audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-quality-reports
          path: reports/
          if-no-files-found: ignore

  browser-quality:
    name: Browser and accessibility quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright and axe checks
        run: npm run test:browser
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Lighthouse CI
        run: npm run lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [static-quality, browser-quality, lighthouse]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Prepare production artifact
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ptd150101.github.io/portfolio-dtp' }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: |
          python3 scripts/build_site.py --output _site
          rsvg-convert -w 1200 -h 630 assets/og-home.svg -o _site/assets/og-home.png
          rsvg-convert -w 1200 -h 630 assets/og-remotekey.svg -o _site/assets/og-remotekey.png
          rsvg-convert -w 1200 -h 630 assets/context-translator-card.svg -o _site/assets/og-context-translator.png
          rsvg-convert -w 1200 -h 630 assets/og-resume.svg -o _site/assets/og-resume.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
