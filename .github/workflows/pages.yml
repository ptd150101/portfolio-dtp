name: Quality checks and GitHub Pages deployment

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
      - name: Checkout latest main
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Remove incomplete PWA configuration
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for name in (
              'index.html',
              'projects/context-video-translator/index.html',
              'projects/remotekey/index.html',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\s*<link\s+rel=["\']manifest["\'][^>]*>\s*', '\n', text, flags=re.I)
              path.write_text(text, encoding='utf-8')

          manifest = Path('site.webmanifest')
          if manifest.exists():
              manifest.unlink()
          PY
      - name: Commit source cleanup
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- index.html projects/context-video-translator/index.html projects/remotekey/index.html site.webmanifest; then
            echo 'PWA source cleanup is already complete.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html projects/context-video-translator/index.html projects/remotekey/index.html site.webmanifest
          git commit -m "Remove incomplete PWA manifest"
          git push origin HEAD:main

  static-quality:
    name: Static quality
    needs: source-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout latest main
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate HTML
        run: npm run validate:html
      - name: Check local links and anchors
        run: npm run check:links
      - name: Audit images and assets
        run: npm run check:assets
      - name: Verify sitemap
        run: npm run check:sitemap
      - name: Upload static audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-quality-reports
          path: reports/
          if-no-files-found: ignore

  browser-quality:
    name: Browser and accessibility quality
    needs: source-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
      - name: Checkout latest main
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright and axe checks
        run: npm run test:browser
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse quality
    needs: source-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
      - name: Checkout latest main
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Lighthouse CI
        run: npm run lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [static-quality, browser-quality, lighthouse]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Prepare production artifact
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ptd150101.github.io/portfolio-dtp' }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: |
          python3 scripts/prepare_site.py --output _site
          rsvg-convert -w 1200 -h 630 assets/og-home.svg -o _site/assets/og-home.png
          rsvg-convert -w 1200 -h 630 assets/og-remotekey.svg -o _site/assets/og-remotekey.png
          rsvg-convert -w 1200 -h 630 assets/context-translator-card.svg -o _site/assets/og-context-translator.png
          rsvg-convert -w 1200 -h 630 assets/og-resume.svg -o _site/assets/og-resume.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
