name: Import Context Translator screenshots

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-context-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original PNG screenshots
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/ptd150101/context-video-translator/main/docs/images"
          curl --fail --location --retry 3 "$base/japanese-study-vietnamese.png" -o assets/context-real-study-vietnamese.png
          curl --fail --location --retry 3 "$base/context-translation-vietnamese.png" -o assets/context-real-translation-vietnamese.png
          curl --fail --location --retry 3 "$base/context-translation-english.png" -o assets/context-real-translation-english.png
          curl --fail --location --retry 3 "$base/multilingual-translation-french.png" -o assets/context-real-translation-french.png

      - name: Validate PNG files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import struct
          from pathlib import Path

          expected = [
              Path('assets/context-real-study-vietnamese.png'),
              Path('assets/context-real-translation-vietnamese.png'),
              Path('assets/context-real-translation-english.png'),
              Path('assets/context-real-translation-french.png'),
          ]
          for path in expected:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path} is not a valid PNG')
              width, height = struct.unpack('>II', data[16:24])
              if width < 1200 or height < 600:
                  raise SystemExit(f'{path} is unexpectedly small: {width}x{height}')
              print(f'{path}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit original screenshots
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/context-real-*.png && git ls-files --error-unmatch assets/context-real-study-vietnamese.png >/dev/null 2>&1; then
            echo "Original screenshots are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/context-real-*.png
          git commit -m "Import original Context Translator screenshots"
          git push
